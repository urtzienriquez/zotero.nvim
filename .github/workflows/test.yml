name: tests

on:
  push:
    branches: [main, v0]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # v0 branch: the full suite on the oldest supported release, the
        # current stable and nightly (async_compat covers the missing vim.async).
        neovim_version: [v0.10.4, stable, nightly]
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim_version }}

      # macOS runners ship Apple's sqlite3 (the one Mac users have too), so
      # only Linux needs it installed.
      - name: Install sqlite3
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Show sqlite3 version
        run: sqlite3 --version

      - name: Clone plenary.nvim
        run: git clone --depth 1 https://github.com/nvim-lua/plenary.nvim tests/deps/plenary.nvim

      - name: Run test suite
        run: ./scripts/test.sh
