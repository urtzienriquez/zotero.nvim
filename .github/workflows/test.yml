name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim_version: [stable, nightly]
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim_version }}

      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Clone plenary.nvim
        run: git clone --depth 1 https://github.com/nvim-lua/plenary.nvim tests/deps/plenary.nvim

      - name: Run test suite (nightly)
        if: matrix.neovim_version == 'nightly'
        run: ./scripts/test.sh

      - name: Run compatibility tests (stable)
        if: matrix.neovim_version == 'stable'
        run: ./scripts/test.sh tests/compat
